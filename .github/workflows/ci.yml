name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, e2e, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache` here: pnpm is not on the PATH until Corepack enables it below.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # Corepack installs the exact pnpm pinned in package.json#packageManager.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Constitution gate 1
      - name: Lint
        run: pnpm lint:ci

      # Constitution gate 2 — unit tests and coverage thresholds
      - name: Unit tests
        run: pnpm test --coverage

      # Constitution gate 3 — end-to-end tests
      - name: End-to-end tests
        run: pnpm test:e2e

      # Constitution gate 4. docs:check reuses this build: it fails when the committed
      # openapi.json no longer matches what the compiled code generates.
      - name: Build
        run: pnpm build && pnpm docs:check

      # Constitution gate 5 — no high or critical advisories
      - name: Dependency audit
        run: pnpm audit --audit-level high
